name: connectly_chat
description: "Embeddable AI chat widget with human-agent handoff for the Connectly platform."
version: 1.0.0
license: MIT
repository: https://github.com/WOW-DIT/connectly_chat_flutter
homepage: https://connectly.wowdigital.sa

environment:
  sdk: ^3.13.4
  flutter: ">=1.17.0"

dependencies:
  audioplayers: ^6.8.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2
  mime: ^2.0.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  record: ^7.1.1
  shared_preferences: ^2.5.5
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

